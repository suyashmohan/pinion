# Pinion: Next.js GUI + `pi` coding agent in one container.
#
#   cp .env.example .env     # provider keys + PINION_WORKSPACE live there
#   docker compose up --build
#   → http://127.0.0.1:3000   (PINION_PORT=3210 to publish elsewhere)
#
# The published port is loopback-only on purpose: Pinion can run shell commands.
# For LAN access publish on all interfaces AND set PINION_ALLOWED_HOSTS to the
# name/IP you browse from (see Security in README.md).
name: pinion

services:
  pinion:
    build:
      context: .
      args:
        # Pinion is tested against pi 0.85.x; bump deliberately.
        PI_VERSION: "0.85.1"
    image: pinion:local
    # No `init: true` — the image's ENTRYPOINT is tini, which must stay PID 1
    # to reap the `pi` subprocesses and forward signals.
    restart: unless-stopped
    ports:
      # Loopback-only by default (Pinion can run shell commands). Override the
      # host port with PINION_PORT=3210; for LAN access replace 127.0.0.1 with
      # 0.0.0.0 — and then set PINION_ALLOWED_HOSTS too.
      - "127.0.0.1:${PINION_PORT:-3000}:3000"
    # Secrets — provider API keys (DEEPSEEK_API_KEY, ANTHROPIC_API_KEY, …),
    # PINION_TOKEN, PINION_WORKSPACE, PINION_ALLOWED_HOSTS — belong in `.env` at
    # the repo root, which is gitignored. Compose loads that whole file into
    # the container here, so no credential ever needs to appear in this YAML.
    # (`cp .env.example .env` to start; missing file is fine.)
    env_file:
      - path: .env
        required: false
    environment:
      PINION_HOST: "0.0.0.0"
      PINION_PORT: "3000"
      # Container paths are pinned here so host values meant for a bare-metal
      # run (e.g. PI_DEFAULT_CWD=/Users/you/projects) can't leak in via .env.
      PI_DEFAULT_CWD: /workspace
      DATABASE_URL: "file:/app/data/pinion.db"
      PI_BINARY: "pi"
      # Optional shared secret / LAN hostnames, also settable in .env.
      PINION_TOKEN: "${PINION_TOKEN:-}"
      PINION_ALLOWED_HOSTS: "${PINION_ALLOWED_HOSTS:-}"
    volumes:
      # SQLite cache (DATABASE_URL=file:/app/data/pinion.db).
      - pinion-data:/app/data
      # pi auth, settings, skills and session JSONL files.
      # Swap for "${HOME}/.pi:/root/.pi" to reuse the host's pi login and
      # sessions inside the container (the container will also write there).
      - pinion-agent:/root/.pi
      # Project tree the agent reads/writes. Defaults to ./workspace.
      - "${PINION_WORKSPACE:-./workspace}:/workspace"

volumes:
  pinion-data:
  pinion-agent:
